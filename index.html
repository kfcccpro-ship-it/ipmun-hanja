function makeStudy20(pool){

}

/* ===== 획순 (Hanzi Writer) ===== */
const STROKE_DATA=new Map();
function strokeLoader(ch,onLoad,onError){
  if(STROKE_DATA.has(ch)){onLoad(STROKE_DATA.get(ch));return}
  fetch(`https://cdn.jsdelivr.net/npm/hanzi-writer-data-jp@0/${ch}.json`).then(r=>{if(!r.ok)throw 0;return r.json()})
  .catch(()=>fetch(`https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0/${ch}.json`).then(r=>{if(!r.ok)throw 0;return r.json()}))
  .then(data=>{STROKE_DATA.set(ch,data);onLoad(data)}).catch(onError);
}
const getStrokeData=ch=>new Promise((resolve,reject)=>strokeLoader(ch,resolve,reject));
const strokePad=size=>Math.max(8,Math.round(size*14/420));
function strokeBox(host,ch,size,opts={}){
  if(!window.HanziWriter){host.innerHTML='<p class="muted">획순 기능을 불러오지 못했습니다.</p>';return null}
  const el=document.createElement('div');el.className='stroke';el.style.width=size+'px';el.style.height=size+'px';el.style.position='relative';
  el.innerHTML=`<svg width="${size}" height="${size}" style="position:absolute"><line x1="${size/2}" y1="0" x2="${size/2}" y2="${size}" stroke="#F0A5A0" stroke-dasharray="4"/><line x1="0" y1="${size/2}" x2="${size}" y2="${size/2}" stroke="#F0A5A0" stroke-dasharray="4"/></svg>`;
  host.appendChild(el);
  return HanziWriter.create(el,ch,Object.assign({width:size,height:size,padding:strokePad(size),strokeColor:'#1B2A44',radicalColor:'#D8443A',
    outlineColor:'#D9E0EA',strokeAnimationSpeed:1.15,delayBetweenStrokes:420,showCharacter:false,showOutline:true,
    charDataLoader:strokeLoader,onLoadCharDataError:()=>{host.innerHTML='<p class="muted">이 글자의 획순 자료가 없습니다.</p>'}},opts));
}
function addStrokeNumbers(host,ch,size,padding=14,opacity=1){
  const layer=document.createElement('div');layer.className='strokeNums';layer.style.opacity=opacity;host.appendChild(layer);
  getStrokeData(ch).then(data=>{
    if(!alive(layer))return;
    const scale=(size-padding*2)/1024;
    (data.medians||[]).forEach((m,i)=>{
      if(!m||!m.length)return;
      const p=m[0],n=document.createElement('span');n.className='strokeNum';n.dataset.stroke=String(i+1);n.textContent=i+1;
      n.style.left=(padding+p[0]*scale)+'px';n.style.top=(padding+(1024-p[1])*scale)+'px';layer.appendChild(n);
    });
  }).catch(()=>{});
  return layer;
}
function mountStrokeLesson(host,ch,hoek,{size=420,auto=true,onFirstComplete=null}={}){
  host.innerHTML=`<div class="strokeLessonStage" id="strokeStage"></div>
    <div class="strokeLessonBar">
      <span class="strokeCountBadge">총 ${hoek}획</span>
      <button class="sun" data-act="all">▶ 처음부터</button>
      <button class="ghost" data-act="one">한 획씩</button>
      <button class="ghost" data-act="num">숫자 숨기기</button>
    </div>
    <div class="strokeStepText">자동 획순을 먼저 봅니다.</div>`;
  const stage=host.querySelector('#strokeStage'),status=host.querySelector('.strokeStepText');
  const writer=strokeBox(stage,ch,size,{showCharacter:false,showOutline:true});
  if(!writer)return null;
  const nums=addStrokeNumbers(stage,ch,size,strokePad(size),1);
  let one=0,numOn=true,firstDone=false;
  const mark=n=>nums.querySelectorAll('.strokeNum').forEach(x=>x.classList.toggle('current',+x.dataset.stroke===n));
  const playAll=()=>{
    one=0;mark(0);status.textContent=`자동 재생 중 · 총 ${hoek}획`;writer.hideCharacter();
    writer.animateCharacter({onComplete:()=>{
      status.textContent=`획순 완료 · 총 ${hoek}획`;
      if(!firstDone){firstDone=true;onFirstComplete&&onFirstComplete()}
    }});
  };
  host.querySelector('[data-act="all"]').onclick=playAll;
  host.querySelector('[data-act="one"]').onclick=()=>{const n=(one%hoek)+1;one=n;mark(n);if(writer.animateStroke)writer.animateStroke(n-1);else writer.animateCharacter();status.textContent=`${n} / ${hoek}획`};
  host.querySelector('[data-act="num"]').onclick=e=>{numOn=!numOn;nums.hidden=!numOn;e.currentTarget.textContent=numOn?'숫자 숨기기':'숫자 보기'};
  if(auto)setTimeout(()=>{if(alive(stage))playAll()},250);
  return writer;
}

    strokeColor:'#9AA8BC',outlineColor:'#C9D2DE',charDataLoader:strokeLoader});

function replayStrokeOrderMini(pad,ch,hoek,onComplete){
  const old=pad.el.querySelector('.postStrokeReplay');if(old)old.remove();
  const layer=document.createElement('div');layer.className='postStrokeReplay miniStrokeLesson';pad.el.appendChild(layer);
  const size=Math.max(96,Math.round(pad.el.getBoundingClientRect().width||130));
  const writer=strokeBox(layer,ch,size,{showCharacter:false,showOutline:true});
  if(!writer){onComplete&&onComplete();return null}
  addStrokeNumbers(layer,ch,size,strokePad(size),.95);
  setTimeout(()=>{if(!alive(layer)){onComplete&&onComplete();return}
    writer.hideCharacter();writer.animateCharacter({onComplete:()=>{
      setTimeout(()=>{if(alive(layer))layer.remove();onComplete&&onComplete()},300);
    }});
  },120);
  return layer;
}

function makePad(host,{cells=2,size=150,grid=true,trace='',alpha=0.2,w=null,h=null,onChange=null,onDown=null,onUp=null}={}){
  const W=w||cells*size,H=h||size,dpr=window.devicePixelRatio||1;
  const pad=document.createElement('div');pad.className='pad';pad.style.width=W+'px';pad.style.height=H+'px';
  const cw=document.createElement('div');cw.className='cells';
  for(let i=0;i<cells;i++){const c=document.createElement('div');c.className='cell'+(grid?' grid':'');cw.appendChild(c)}
  const mk=()=>{const c=document.createElement('canvas');c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';const x=c.getContext('2d');x.scale(dpr,dpr);return[c,x]};
  const [bg,bctx]=mk(),[cv,ctx]=mk();
  const chars=[...(trace||'')];
  const paintGuide=()=>{bctx.clearRect(0,0,W,H);chars.forEach((ch,i)=>{
    const a=Array.isArray(alpha)?alpha[i]:alpha;if(!ch||!a)return;
    bctx.globalAlpha=a;bctx.fillStyle='#1B2A44';bctx.textAlign='center';bctx.textBaseline='middle';
    bctx.font=`900 ${Math.round(H*0.8)}px "Noto Serif KR","Songti SC",serif`;bctx.fillText(ch,(i+.5)*W/cells,H*0.53)});bctx.globalAlpha=1};
  paintGuide();if(document.fonts&&chars.length)document.fonts.ready.then(paintGuide);
  ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111A2E';
  pad.append(cw,bg,cv);host.appendChild(pad);
  const k=Math.max(.7,H/150);
  const ua=navigator.userAgent||'';
  const isIPad=/iPad/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
  const isGalaxy=/Android/.test(ua)&&(/SM-|Samsung/i.test(ua));
  let drawing=false,last=null,strokes=0,locked=false,currentPath=null,paths=[];
  const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,p:(e.pressure>0?e.pressure:0.5),pt:e.pointerType||'unknown'}};
  const penWidth=p=>{const base=isIPad?4.8:isGalaxy?4.1:4.5,gain=isIPad?7.2:isGalaxy?5.8:7;return(base+p*gain)*k};
  const line=(a,b)=>{ctx.lineWidth=penWidth(b.p);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()};
  const redrawInk=()=>{ctx.clearRect(0,0,W,H);for(const path of paths){if(!path.length)continue;if(path.length===1){const a=path[0];line(a,{...a,x:a.x+.1});continue}for(let i=1;i<path.length;i++)line(path[i-1],path[i])}};
  // iOS: 길게 누르기(텍스트 선택·확대경) 방지

  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);cv.addEventListener('lostpointercapture',end);
  return{
    el:pad,canvas:cv,
    clear(){ctx.clearRect(0,0,W,H);paths=[];currentPath=null;strokes=0;onChange&&onChange()},
    undo(){if(drawing||!paths.length)return;paths.pop();strokes=paths.length;redrawInk();onChange&&onChange()},

}
// 필기 캔버스들을 흰 바탕 한 장으로 합치기 (채점·리포트용)
function joinImg(pads,S=80,ratio=1,gridCells=1,model=''){
  const cw=S*ratio,n=pads.length+(model?1:0);
  const o=document.createElement('canvas');o.width=cw*n;o.height=S;const x=o.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,o.width,S);
  if(model){x.fillStyle='#FFF4D6';x.fillRect(0,0,cw,S);x.fillStyle='#1B2A44';x.textAlign='center';x.textBaseline='middle';x.font=`900 ${S*.78}px "Noto Serif KR",serif`;x.fillText(model,cw/2,S*.53)}
  for(let i=0;i<n;i++){x.strokeStyle='#999';x.lineWidth=1;x.strokeRect(i*cw+.5,.5,cw-1,S-1);
    if(gridCells&&ratio===1){x.setLineDash([4,4]);x.strokeStyle='#F0A5A0';x.beginPath();x.moveTo(i*cw+cw/2,0);x.lineTo(i*cw+cw/2,S);x.moveTo(i*cw,S/2);x.lineTo(i*cw+cw,S/2);x.stroke();x.setLineDash([])}}
  pads.forEach((p,i)=>x.drawImage(p.canvas,(i+(model?1:0))*cw,0,cw,S));
  return o.toDataURL('image/jpeg',0.65);
}
const cellSize=n=>Math.min(170,Math.floor((Math.min(window.innerWidth,980)-80)/n));
function gate(btn,sec,label){btn.disabled=true;let n=sec;const t=()=>{if(!alive(btn))return;if(n<=0){btn.disabled=false;btn.textContent=label;return}btn.textContent=`${label} (${n})`;n--;setTimeout(t,1000)};t()}
const CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const cho=s=>{const c=s.charCodeAt(0)-0xAC00;return c>=0&&c<11172?CHO[(c/588)|0]:s[0]};

/* ===== 오늘의 학습: 한 컬럼 흐름 ===== */
// 단어마다: [글자: 배우기 → 5번 쓰기 → 훈·음 쓰기] × 2 → 단어 익히기 → 누적 쪽지(1번 단어부터)
function buildSteps(start,wordIds=null){
  const words=wordIds?.length?wordIds.map(byId).filter(Boolean):WL.slice(start,start+WPD);
  const ids=words.map(w=>w.id),st=[];
  words.forEach((w,k)=>{
    charsOf(w).forEach(c=>{st.push({t:'learn',c,k});st.push({t:'write',c,k});st.push({t:'he',c,k})});
    st.push({t:'word',w,k});st.push({t:'quiz',k,start,wordIds:ids});
  });
  return st;
}
const STEP_NAME={learn:'배우기',write:'5번 쓰기',he:'훈·음 쓰기',word:'단어 익히기',quiz:'누적 쪽지'};
function startDay(){
  const words=sessionWords(null);
  if(!words.length)return toast('부모 모드에서 오늘 학습 범위를 먼저 정해 주세요');
  db.sess={date:today(),start:Math.max(0,WL.findIndex(w=>w.id===words[0].id)),wordIds:words.map(w=>w.id),step:0,maxStep:0,activeMs:0,awayN:0};
  save();daily();
}
function gotoStep(i){
  const ss=db.sess;if(!ss)return;
  ss.step=Math.max(0,Math.min(i,ss.maxStep||0));save();daily();
}
function daily(){
  curView='daily';
  const ss=db.sess;if(!ss)return home();
  const words=sessionWords(ss),steps=buildSteps(ss.start,ss.wordIds);
  if(ss.step>=steps.length)return finishDay();
  const canForward=ss.step<(ss.maxStep||0);
  ss.maxStep=Math.max(ss.maxStep||0,ss.step);save();
  const cur=steps[ss.step],pct=Math.round(ss.step/steps.length*100);
  const firstStepOfWord=k2=>steps.findIndex(st=>st.k===k2);
  let flow='';
  words.slice(0,cur.k).forEach((w,i)=>flow+=`<div class="fl">✓ ${i+1}단어 <b class="hz">${w.word}</b> 배우기·쪽지 완료</div>`);
  steps.forEach((st,i)=>{if(i<ss.step&&st.k===cur.k)flow+=`<div class="fl nav" onclick="gotoStep(${i})">✓ ${st.c?`<b class="hz">${st.c.ch}</b> `:st.w?`<b class="hz">${st.w.word}</b> `:''}${STEP_NAME[st.t]}</div>`});
  flow+=`<div class="fl now">▶ ${cur.c?`<b class="hz">${cur.c.ch}</b> `:cur.w?`<b class="hz">${cur.w.word}</b> `:''}${STEP_NAME[cur.t]}${cur.t==='quiz'?` (1~${cur.k+1}단어)`:''}</div>`;
  app.innerHTML=`
  <div class="card">
    <div class="row" style="justify-content:space-between"><b class="jua" style="font-size:22px">오늘의 학습 · ${words.length}단어</b><span class="muted">${pct}%</span></div>
    <div class="muted" style="margin-top:4px">부모 지정 범위 · ${dailyScopeLabel()}</div>
    <div id="focusTime" class="focusTime"></div>
    <div class="prog" style="margin:8px 0"><div style="width:${pct}%"></div></div>
    <div class="wchips">${words.map((w,k)=>{const canJump=k<cur.k&&firstStepOfWord(k)<=(ss.maxStep||0);
      return `<span class="wchip ${k<cur.k?'done':k===cur.k?'now':''}${canJump?' nav':''}"${canJump?` onclick="gotoStep(${firstStepOfWord(k)})"`:''}>${w.word}<small>${k<cur.k?'완료':w.read}</small></span>`}).join('')}</div>
    <div class="row navRow" style="justify-content:space-between;margin-top:10px">
      <button class="ghost" id="prevBtn" ${ss.step<=0?'disabled':''}>◀ 이전</button>
      <button class="ghost" id="nextBtn" ${canForward?'':'disabled'}>다음 ▶</button>
    </div>
  </div>
  <div class="flow">${flow}</div>
  <div class="card stepCard" id="stepCard"></div>`;
  $('#prevBtn').onclick=()=>gotoStep(ss.step-1);
  $('#nextBtn').onclick=()=>gotoStep(ss.step+1);
  const card=$('#stepCard');
  const next=()=>{if(!alive(card))return;ss.step++;save();daily()};
  ({learn:stepLearn,write:stepWrite,he:stepHE,word:stepWord,quiz:stepQuiz})[cur.t](card,cur,next);
  paintFocus();
  setTimeout(()=>{if(alive(card))card.scrollIntoView({behavior:'smooth',block:'start'})},60);
}

const ALPHA=[0,0,0,0,0]; // 1~3칸은 실제 획순·숫자 덮어쓰기, 4·5칸은 빈칸 독립쓰기
function calcCellSize(card){
  const cs=getComputedStyle(card),w=card.clientWidth||700;
  const inner=Math.max(280,w-(parseFloat(cs.paddingLeft)||0)-(parseFloat(cs.paddingRight)||0));
  const cols=inner>=620?5:inner>=420?3:2,gap=12;
  return Math.min(154,Math.max(108,Math.floor((inner-gap*(cols-1))/cols)));
}
function stepWrite(card,{c},next){
  const cs=calcCellSize(card);
  card.innerHTML=`<div class="stepTag">5번 쓰기</div>
  <div class="writeHero writeHeroSimple">
    <div style="text-align:center"><div id="mdl"></div></div>

  </div>

  const pads=[];let cur=0,tick=null,counting=false;

  const setCur=()=>{pads.forEach((p,i)=>{p.lock(i!==cur);p.el.classList.toggle('active',i===cur)});stat()};
  let feedbackTimer=null,cycle=0;
  const clearFeedback=()=>{clearTimeout(feedbackTimer);feedbackTimer=null;const f=$('#writeFeedback');if(f){f.classList.remove('show');f.innerHTML=''}};
  const cancelT=()=>{cycle++;clearInterval(tick);tick=null;counting=false;clearFeedback();const p=pads[cur];const o=p&&p.el.querySelector('.cd');if(o)o.remove();const rr=p&&p.el.querySelector('.postStrokeReplay');if(rr)rr.remove()};

    feedbackTimer=setTimeout(clearFeedback,2000);

  };
  const startT=()=>{
    if(counting||cur>=5)return;

    const o=document.createElement('div');o.className='cd';o.textContent=n;p.el.appendChild(o);
    const maybeAdvance=()=>{
      if(token!==cycle||!delayDone||!replayDone)return;

    tick=setInterval(()=>{

        $('#fb').innerHTML=ok?'<span class="okMsg">정답! 👏</span>':`<span class="badMsg">정답은 "${w.read}"</span>`;

      $('#clr').onclick=()=>{p1.clear();p2.clear()};
      $('#sub').onclick=()=>{db.qz[date].push({tag,type:'write',wid:w.id,img:joinImg([p1,p2],80),grade:null});save();i++;show()};
    }
  };
  show();
}

  const maxIx=Math.max(-1,...words.map(w=>WL.findIndex(x=>x.id===w.id)));if(maxIx>=0)db.wordNext=Math.max(db.wordNext,maxIx+1);

/* ===== 카톡 리포트 (이미지 + 글) ===== */
const loadImg=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src});
async function sendReport(date,onDone){
  const ids=db.days[date]||Object.keys(db.notes[date]||{}).map(Number);
  const qz=db.qz[date]||[],he=db.he[date]||{},notes=db.notes[date]||{},fc=db.focus[date];
  const reads=qz.filter(r=>r.type==='read'),writes=qz.filter(r=>r.type==='write');
  const okR=reads.filter(r=>r.ok).length;
  const heRe=Object.entries(he).filter(([,v])=>v>0).map(([id])=>byId(+id).ch);
  const focusLine=fc?`집중 시간: ${Math.floor(fc.ms/60000)}분 ${Math.floor(fc.ms%60000/1000)}초 (목표 ${db.focusGoalMin||20}분)${fc.awayN?` · 자리비움 ${fc.awayN}회`:''}`:'';
  const text=`[태이 한자] ${date} 학습 리포트
- 배운 한자(${ids.length}자): ${ids.map(id=>{const c=byId(id);return `${c.ch}(${c.hun} ${c.eum})`}).join(', ')}
- 훈·음 다시 쓴 글자: ${heRe.join(', ')||'없음'}
- 누적 쪽지 읽기: ${okR}/${reads.length}
- 한자 쓰기 ${writes.length}문제: 부모 모드 → 채점에서 확인해 주세요${focusLine?`\n- ${focusLine}`:''}`;
  // 이미지 만들기
  const W=920,P=24,noteIds=Object.keys(notes),lastWrites=writes.filter(r=>r.tag===writes[writes.length-1]?.tag);
  const lines=[`배운 한자 ${ids.length}자: ${ids.map(id=>byId(id).ch).join(' ')}`,`훈·음 다시 쓴 글자: ${heRe.join(' ')||'없음'}`,`누적 쪽지 읽기: ${okR} / ${reads.length}`,`한자 쓰기 ${writes.length}문제 → 부모 채점 필요`];
  if(focusLine)lines.push(focusLine);
  const H=P+60+30*lines.length+20+(noteIds.length?40+noteIds.length*84:0)+(lastWrites.length?50+100:0)+P;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
  x.fillStyle='#F3F7FB';x.fillRect(0,0,W,H);x.fillStyle='#22304A';x.textBaseline='top';
  x.font='bold 34px sans-serif';x.fillText(`태이 한자 학습 리포트 · ${date}`,P,P);
  x.font='22px sans-serif';let y=P+60;
  lines.forEach(t=>{x.fillText(t,P,y);y+=30});
  y+=20;
  if(noteIds.length){x.font='bold 24px sans-serif';x.fillText('5번 쓰기 노트',P,y);y+=40;x.font='22px sans-serif';
    for(const id of noteIds){const c=byId(+id),im=await loadImg(notes[id]);x.fillText(`${c.ch} ${c.hun} ${c.eum}`,P,y+28);if(im)x.drawImage(im,P+180,y,im.width*1.2,im.height*1.2);y+=84}}
  if(lastWrites.length){x.font='bold 24px sans-serif';x.fillText('마지막 누적 쪽지 · 한자 쓰기',P,y);y+=50;
    let xx=P;for(const r of lastWrites){const im=await loadImg(r.img);if(im)x.drawImage(im,xx,y,160,80);x.font='16px sans-serif';x.fillText(byId(r.wid).read,xx+50,y+82);xx+=172}}
  const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.85));
  const file=new File([blob],`hanja-${date}.jpg`,{type:'image/jpeg'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],text,title:'태이 한자 리포트'});onDone&&onDone();return}
    catch(e){if(e.name==='AbortError'){toast('취소됐어요. 카톡으로 보내야 다음으로 넘어가요');return}}
  }
  // 공유 기능이 없을 때: 이미지 저장 + 글 복사
  const url=URL.createObjectURL(blob);
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="card"><h3 style="margin-top:0">리포트</h3><img src="${url}" style="width:100%;border-radius:8px">
    <textarea rows="6" style="margin-top:10px">${text}</textarea>
    <div class="row" style="margin-top:10px"><a class="pri btnlink" href="${url}" download="hanja-${date}.jpg">이미지 저장</a><button class="pri" id="cp">글 복사</button><button class="ghost" id="cl">닫기</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector('a.btnlink').addEventListener('click',()=>onDone&&onDone());
  m.querySelector('#cp').onclick=()=>{navigator.clipboard.writeText(text).then(()=>toast('복사했어요. 카톡에 붙여넣기 하세요'),()=>toast('복사하지 못했어요'));onDone&&onDone()};
  m.querySelector('#cl').onclick=()=>{m.remove();onDone&&onDone()};
}

function gradeQuiz(v){
  const dates=Object.keys(db.qz).sort().reverse();
  const pn=dates.reduce((a,d)=>a+db.qz[d].filter(r=>r.type==='write'&&r.grade===null).length,0);
  v.innerHTML=`<div class="card"><h3 style="margin-top:0">누적 쪽지 · 한자 쓰기 채점 <span class="pill ${pn?'wait':''}">${pn?`대기 ${pn}`:'대기 없음'}</span></h3>
  ${dates.map(d=>{
    const all=db.qz[d],ws=all.map((r,i)=>[r,i]).filter(([r])=>r.type==='write');if(!ws.length)return'';
    const rd=all.filter(r=>r.type==='read'),wo=ws.filter(([r])=>r.grade===true).length;
    return`<details ${ws.some(([r])=>r.grade===null)?'open':''}><summary class="jua" style="font-size:18px;padding:6px 0;cursor:pointer">${d} · 읽기 ${rd.filter(r=>r.ok).length}/${rd.length} · 쓰기 ${wo}/${ws.length}</summary>
    <div class="row"><button class="ghost" data-allo="${d}">남은 문항 모두 O</button><button class="sun" data-rep="${d}">📤 리포트</button></div>
    ${ws.map(([r,i],n)=>{const w=byId(r.wid);return`<div class="gradeRow"><b class="jua">${n+1}</b>
      <div class="gradeImgWrap"><img src="${r.img}" alt="${w.read} 답안"><span class="ansOverlay hz">${w.word}</span></div>
      <div><div class="muted">${w.read} → 정답 · ${w.page}쪽</div><div class="ans">${w.word}</div></div>
      <div class="gbtn"><button data-d="${d}" data-i="${i}" data-g="1" class="${r.grade===true?'selO':''}">O</button><button data-d="${d}" data-i="${i}" data-g="0" class="${r.grade===false?'selX':''}">X</button></div></div>`}).join('')}
    </details>`}).join('')||'<p class="muted">아직 누적 쪽지 기록이 없습니다</p>'}</div>`;
  const setG=(r,g)=>{
    if(r.grade===g)return;
    if(g===false){addWrong(r.wid);addWrong(r.wid+1)}

    r.grade=g;
  };
  v.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{setG(db.qz[b.dataset.d][+b.dataset.i],b.dataset.g==='1');save();parent()});
  v.querySelectorAll('[data-allo]').forEach(b=>b.onclick=()=>{db.qz[b.dataset.allo].forEach(r=>{if(r.type==='write'&&r.grade===null)setG(r,true)});save();parent()});
  v.querySelectorAll('[data-rep]').forEach(b=>b.onclick=()=>sendReport(b.dataset.rep));
}

function strokeSpeed(list){
  let i=0,ok=0;
  const step=()=>{
    if(i>=list.length){logFast('획수 점검',ok,list.length);app.innerHTML=`<div class="card" style="text-align:center"><h2>획수 점검 결과</h2><div class="score">${ok} / ${list.length}</div><button class="pri" onclick="go('fast')">점검 메뉴</button></div>`;return}
    const w=list[i],cs=charsOf(w),c=cs[Math.random()<.5?0:1],correct=c.hoek;
    const cand=[correct];for(let d=1;cand.length<4;d++){for(const v of [correct-d,correct+d])if(v>0&&!cand.includes(v))cand.push(v);if(d>8)break}
    const opts=shuffle(cand.slice(0,4));
    app.innerHTML=`<div class="row" style="justify-content:space-between"><span class="jua">${i+1} / ${list.length}</span><span class="book">📖 ${c.detailPage||c.page}쪽</span></div><div class="card"><div class="qword">${c.ch}</div><div class="q">${c.hun} ${c.eum} · 몇 획일까요?</div><div class="choice">${opts.map(n=>`<button>${n}획</button>`).join('')}</div></div>`;
    app.querySelectorAll('.choice button').forEach(b=>b.onclick=()=>{const n=parseInt(b.textContent);if(n===correct){ok++;toast('정답!')}else{addWrong(c.id);save();toast(`정답: ${correct}획`)}i++;setTimeout(step,n===correct?350:900)});
  };step();
}

function speedRead(list){

    clearInterval(timer);
    if(i>=list.length){logFast('읽기 스피드',ok,list.length);app.innerHTML=`<div class="card" style="text-align:center"><h2>읽기 스피드 결과</h2><div class="score">${ok} / ${list.length}</div><button class="pri" onclick="go('fast')">점검 메뉴</button></div>`;return}
    const d=list[i];
    const opts=shuffle([d.read,...shuffle(uniqWords(ITEMS).filter(x=>x.read!==d.read)).slice(0,3).map(x=>x.read)]);
    let left=5;
    app.innerHTML=`<div class="row" style="justify-content:space-between"><span class="jua">${i+1} / ${list.length}</span><span class="timer" id="tm">5초</span></div>
    <div class="prog" style="margin:10px 0"><div style="width:${i/list.length*100}%"></div></div>
    <div class="card"><div style="text-align:center"><span class="book">📖 ${d.page}쪽${d.detailPage?` · 쓰기 ${d.detailPage}쪽`:''}</span></div><div class="qword">${d.word}</div><div class="choice" style="margin-top:16px">${opts.map(o=>`<button>${o}</button>`).join('')}</div></div>`;
    const pick=v=>{clearInterval(timer);
      if(v===d.read){ok++;toast('정답!')}else{addWrong(d.id);save();toast(`정답: ${d.read} · 📖 ${d.page}쪽`)}

    app.querySelectorAll('.choice button').forEach(b=>b.onclick=()=>pick(b.textContent));
    timer=setInterval(()=>{left--;const t=$('#tm');if(t)t.textContent=left+'초';if(left<=0)pick(null)},1000);
  };
  step();
}

    <div class="row" style="justify-content:space-between"><div><span class="stepTag" style="margin:0">큰글씨 획순</span><span class="jua" style="font-size:28px;margin-left:10px">${c.hun} ${c.eum} · ${c.hoek}획</span></div><button class="ghost" id="strokeBack">목록</button></div>
    <div id="strokeFocusHost" class="strokeFocusHost"></div>
    <p class="say">숫자 1부터 차례대로 눈으로 따라가고, 손가락이나 펜으로 공중에 한 번 써 보세요.</p>
  </div>`;
  mountStrokeLesson($('#strokeFocusHost'),c.ch,c.hoek,{size,auto:true});
  $('#strokeBack').onclick=strokeHub;
}

/* ===== 책으로 찾기 ===== */
function bookIdx(){
  const pages=allPrintedPages();
  app.innerHTML=`<h2 style="margin-top:0">📖 책으로 찾기</h2><p class="muted">쪽을 누르면 그 쪽 한자를 다시 볼 수 있어요.</p><div id="pl"></div>`;
  pages.forEach(p=>{const list=ITEMS.filter(d=>pageIn(d,p));const b=document.createElement('button');b.className='pagebtn';
    const done=list.filter(d=>db.learned.includes(d.id)).length;
    b.innerHTML=`<span class="book">📖 ${p}쪽</span><span class="hz">${uniqWords(list).map(d=>d.word).join('  ')}</span><span class="muted">${done}/${list.length} 배움</span>`;
    b.onclick=()=>learn(list,0,()=>go('bookIdx'));$('#pl').appendChild(b)});
}

/* ===== 라우터 ===== */
let curView='home';
function go(v){
  window.scrollTo(0,0);
  if(db.pendingReport){curView='gate';return reportGate()}
  curView=v;({home,daily,strokeHub,preStudy,bookIdx,fast,exam,record,parent:parentLogin})[v]()
}
$('#homeBtn').onclick=()=>go('home');
$('#parentBtn').onclick=()=>go('parent');
go('home');
</script>
</body>
