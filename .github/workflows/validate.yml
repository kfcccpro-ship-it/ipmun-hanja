name: Validate Hanja App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.S)
          Path('inline-check.js').write_text('\n'.join(blocks),encoding='utf-8')
          print('inline blocks',len(blocks),'bytes',Path('inline-check.js').stat().st_size)
          PY
      - name: JavaScript syntax check
        run: node --check inline-check.js
      - name: External JavaScript syntax check
        run: |
          node --check assets/v21-parent-picker.js
          node --check assets/v22-points.js
          node --check assets/v23-daily-routine.js
          node --check assets/v25-five-day-flow.js
      - name: Daily routine logic tests
        run: |
          node tests/routine-logic.js
          node tests/v25-flow-logic.js
          node tests/v251-ipad-regression.js
          node tests/v26-learning-regression.js
          node tests/v27-voice-recall-eraser.js
          node tests/v271-he-before-write-clear.js
      - name: Structural checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          s=Path('index.html').read_text(encoding='utf-8')
          checks={
            'old_ui_palette':'--paper:#F3F7FB' in s,
            'old_ui_title':'태이를 위해 아빠가 만든 한자앱' in s,
            'locked_data':'const MASTER=DATA;' in s,
            'items_model':'const ITEMS=[]' in s,
            'exact_stroke':'if(n===c.hoek)startT()' in s,
            'stroke_fast':'function strokeSpeed' in s,
            'stroke_numbered':'function mountStrokeLesson' in s and 'strokeNum' in s,
            'forced_stroke_first':'onFirstComplete' in s and '획순 자동 재생 중' in s,
            'simple_hun_eum':'[${c.hun} ${c.eum}]' in s,
            'mini_same_engine':'function replayStrokeOrderMini' in s and 'strokeBox(layer,ch,size,{showCharacter:false,showOutline:true})' in s,
            'stroke_trace_3':'attachTraceGuide(p,c.ch,cs,k)' in s and 'if(k<3)' in s,
            'stroke_hub':'function strokeHub' in s and '큰글씨 획순' in s,
            'word_combination':'두 글자 조합으로 외우기' in s,
            'page_range':'const pages=allPrintedPages();' in s,
            'no_direct_DATA_calls':not re.search(r'\bDATA\.(filter|map|find|length)',s),
            'single_openSub':s.count('let openSub=null;')==1,
            'parent_grade':'function pGrade' in s,
            'exam_20':'읽기 10문제 + 쓰기 10문제' in s,
            'daily_word_scope':'function pDailyRange' in s or 'v21-parent-picker.js' in s,
            'detail_page_picker':'assets/v21-parent-picker.js' in s and '29~52쪽' in s,
            'explicit_word_scope':'scope.wordIds?.length' in s,
            'prestudy_20':'function preStudy' in s and '시험 전 20쓰기 학습' in s,
            'write_clues':'writeClues' in s and '[${c.hun} ${c.eum}]' in s,
            'hint_2_4':'힌트 1 · 2획' in s and '힌트 2 · 4획' in s and 'renderStrokePrefix' in s,
            'daily_500_points':'assets/v22-points.js' in s,
            'points_state':'points:{total:0,days:{}}' in s and 'dailyChecks:[]' in s,
            'daily_two_track':'assets/v23-daily-routine.js' in s,
            'weekly_plan':'weeklyPlan:null' in s and 'quizProgress:null' in s,
            'daily_quiz_plan_state':'dailyQuizPlans:{}' in s,
            'week_expiry':'function isCurrentWeekPlan' in Path('assets/v23-daily-routine.js').read_text(encoding='utf-8'),
            'reward_integration':'learnCore&&rewarded' in Path('assets/v23-daily-routine.js').read_text(encoding='utf-8'),
            'daily_resume':'getDailyQuizPlan' in Path('assets/v23-daily-routine.js').read_text(encoding='utf-8'),
            'ten_word_daily':'10단어' in Path('assets/v21-parent-picker.js').read_text(encoding='utf-8'),
            'v25_five_day':'FIVE_DAYS=5' in Path('assets/v25-five-day-flow.js').read_text(encoding='utf-8'),
            'v25_two_sets':'1세트 · 이번 주 복습' in Path('assets/v25-five-day-flow.js').read_text(encoding='utf-8') and '2세트 · 실제 시험 대비' in Path('assets/v25-five-day-flow.js').read_text(encoding='utf-8'),
            'v25_surprise':'깜짝 쪽지시험 만들기' in Path('assets/v25-five-day-flow.js').read_text(encoding='utf-8'),
            'v25_two_second_delay':'let n=2,delayDone=false' in s,
            'v251_ipad_number_layer':"layer.style.width=size+'px'" in s and "layer.style.left='50%'" in s,
            'v251_sequential_chars':'studyPhase' in Path('assets/v25-five-day-flow.js').read_text(encoding='utf-8') and '첫 글자' in Path('assets/v25-five-day-flow.js').read_text(encoding='utf-8') and '둘째 글자' in Path('assets/v25-five-day-flow.js').read_text(encoding='utf-8'),
            'v26_five_write':'function runFiveWrite' in Path('assets/v25-five-day-flow.js').read_text(encoding='utf-8') and '1~3칸은 숫자 획순 따라쓰기' in Path('assets/v25-five-day-flow.js').read_text(encoding='utf-8'),
            'v26_usage':'연예·아이돌·무대 예시' in Path('assets/v25-five-day-flow.js').read_text(encoding='utf-8') and '드라마·방송 대사처럼 소리 내어 읽기' in Path('assets/v25-five-day-flow.js').read_text(encoding='utf-8'),
            'v26_collision':'const placed=[],gap=' in s,
            'v26_large_hanja':'약한 획수·획순을 위해 한자 표시' in Path('assets/v25-five-day-flow.js').read_text(encoding='utf-8'),
            'v27_voice':'window.SpeechRecognition||window.webkitSpeechRecognition' in Path('assets/v25-five-day-flow.js').read_text(encoding='utf-8') and 'speechSynthesis' in Path('assets/v25-five-day-flow.js').read_text(encoding='utf-8'),
            'v27_recall_gate':'function charRecallGate' in Path('assets/v25-five-day-flow.js').read_text(encoding='utf-8') and '음·뜻·획수' in Path('assets/v25-five-day-flow.js').read_text(encoding='utf-8'),
            'v27_eraser':"er.className='padEraserMini'" in s and 'const eraseAt=p=>' in s,
            'v271_over_clear':"overClear.className='overClearBtn'" in s and 'overClear.onclick' in s and 'clearInk()' in s,
            'v271_he_before_write':"st.push({t:'learn',c,k});st.push({t:'he',c,k});st.push({t:'write',c,k})" in s and '획순 확인 완료 → 훈·음·획수 쓰기' in s and '5번 쓰기 전 · 훈·음·획수 확인' in Path('assets/v25-five-day-flow.js').read_text(encoding='utf-8'),
          }
          for k,v in checks.items(): print(k, 'PASS' if v else 'FAIL')
          if not all(checks.values()): sys.exit(1)
          PY
