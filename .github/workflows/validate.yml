name: Validate Hanja App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.S)
          Path('inline-check.js').write_text('\n'.join(blocks),encoding='utf-8')
          print('inline blocks',len(blocks),'bytes',Path('inline-check.js').stat().st_size)
          PY
      - name: JavaScript syntax check
        run: node --check inline-check.js
      - name: External JavaScript syntax check
        run: |
          node --check assets/v21-parent-picker.js
          node --check assets/v22-points.js
          node --check assets/v23-daily-routine.js
      - name: Structural checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          s=Path('index.html').read_text(encoding='utf-8')
          checks={
            'old_ui_palette':'--paper:#F3F7FB' in s,
            'old_ui_title':'태이를 위해 아빠가 만든 한자앱' in s,
            'locked_data':'const MASTER=DATA;' in s,
            'items_model':'const ITEMS=[]' in s,
            'exact_stroke':'if(n===c.hoek)startT()' in s,
            'stroke_fast':'function strokeSpeed' in s,
            'stroke_numbered':'function mountStrokeLesson' in s and 'strokeNum' in s,
            'forced_stroke_first':'onFirstComplete' in s and '획순 자동 재생 중' in s,
            'simple_hun_eum':'[${c.hun} ${c.eum}]' in s,
            'mini_same_engine':'function replayStrokeOrderMini' in s and 'strokeBox(layer,ch,size,{showCharacter:false,showOutline:true})' in s,
            'stroke_trace_3':'attachTraceGuide(p,c.ch,cs,k)' in s and 'if(k<3)' in s,
            'stroke_hub':'function strokeHub' in s and '큰글씨 획순' in s,
            'word_combination':'두 글자 조합으로 외우기' in s,
            'page_range':'const pages=allPrintedPages();' in s,
            'no_direct_DATA_calls':not re.search(r'\bDATA\.(filter|map|find|length)',s),
            'single_openSub':s.count('let openSub=null;')==1,
            'parent_grade':'function pGrade' in s,
            'exam_20':'읽기 10문제 + 쓰기 10문제' in s,
            'daily_word_scope':'function pDailyRange' in s or 'v21-parent-picker.js' in s,
            'detail_page_picker':'assets/v21-parent-picker.js' in s and '29~52쪽' in s,
            'explicit_word_scope':'scope.wordIds?.length' in s,
            'prestudy_20':'function preStudy' in s and '시험 전 20쓰기 학습' in s,
            'write_clues':'writeClues' in s and '[${c.hun} ${c.eum}]' in s,
            'hint_2_4':'힌트 1 · 2획' in s and '힌트 2 · 4획' in s and 'renderStrokePrefix' in s,
            'daily_500_points':'assets/v22-points.js' in s,
            'points_state':'points:{total:0,days:{}}' in s and 'dailyChecks:[]' in s,
            'daily_two_track':'assets/v23-daily-routine.js' in s,
            'weekly_plan':'weeklyPlan:null' in s and 'quizProgress:null' in s,
            'ten_word_daily':'10단어' in Path('assets/v21-parent-picker.js').read_text(encoding='utf-8'),
          }
          for k,v in checks.items(): print(k, 'PASS' if v else 'FAIL')
          if not all(checks.values()): sys.exit(1)
          PY
